name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -race -v ./...
      - run: go install gotest.tools/gotestsum@v1.13.0
      - run: gotestsum --format github-actions -- -race -timeout 5m ./...
